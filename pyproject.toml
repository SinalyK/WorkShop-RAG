[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-rag"
version = "1.0.0"
description = "A Retrieval-Augmented Generation (RAG) Agent System with Bi-encoder, Cross-encoder, Self-Retrieval and Tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ENIAD - 2IA Semestre V", email = "startlingadama@gmail.com"}
]

keywords = [
    "RAG",
    "retrieval-augmented-generation",
    "LLM",
    "NLP",
    "agent",
    "ReAct",
    "ChromaDB",
    "BiEncoder",
    "CrossEncoder"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.1",
    "langchain-community>=0.0.1",
    "langgraph>=0.0.1",
    "chromadb>=0.3.21",
    "sentence-transformers>=2.2.2",
    "tavily-python>=0.1.0",
    "google-generativeai>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "termcolor>=1.1.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "backoff>=2.2.1",
    "jupyter>=1.0.0",
    "ipython>=8.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/SinalyK/WorkShop-RAG"
Repository = "https://github.com/SinalyK/WorkShop-RAG"
Documentation = "https://github.com/SinalyK/WorkShop-RAG#readme"
Issues = "https://github.com/SinalyK/WorkShop-RAG/issues"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["*.py"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
